<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass 5 · Prism Foil</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../design-system/tokens.css">
<style>
@font-face { font-family: 'Inter'; src: url(../../design-system/fonts/InterVariable.ttf) format('truetype'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url(../../design-system/fonts/GeistMono-SemiBold.ttf) format('truetype'); font-weight: 600; font-display: swap; }
@property --mx { syntax: '<number>'; inherits: true; initial-value: .3; }
@property --my { syntax: '<number>'; inherits: true; initial-value: .25; }
@property --tx { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --ty { syntax: '<number>'; inherits: true; initial-value: 0; }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 80px 16px; background: var(--bg); color: var(--text); font: 500 16px/1.4 var(--font-sans); letter-spacing: -.04em; -webkit-font-smoothing: antialiased; }
p, dl, dd { margin: 0; }
.lbl { font: 600 10px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0; }
.lbl-1 { font: 600 12px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0; }

:root {
  --h1: color-mix(in oklab, var(--chart-6) 65%, var(--neutral-0));
  --h2: color-mix(in oklab, var(--chart-9) 65%, var(--neutral-0));
  --h3: color-mix(in oklab, var(--chart-8) 60%, var(--neutral-0));
  --h4: color-mix(in oklab, var(--chart-7) 60%, var(--neutral-0));
  --h5: color-mix(in oklab, var(--chart-10) 55%, var(--neutral-0));
  --h6: color-mix(in oklab, var(--chart-1) 42%, var(--neutral-0));
  --h7: color-mix(in oklab, var(--primary-300) 65%, var(--neutral-0));
}

.hit { width: min(504px, 100%); }
/* Physical object: a full-foil collector card, 12px corners. The whole sheet is a prism hologram. */
.card { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 24px; padding: 32px; border-radius: 12px; color: var(--neutral-950);
  --cx: calc((1 - var(--mx)) * 100%); --cy: calc(var(--my) * 60%);
  background:
    radial-gradient(circle at var(--cx) var(--cy), color-mix(in srgb, var(--neutral-0) 90%, transparent), transparent 30%),
    repeating-conic-gradient(from calc(var(--mx) * 40deg) at var(--cx) var(--cy), var(--h1) 0deg, var(--h3) 1.5deg, var(--h5) 3deg, var(--h7) 4.5deg, var(--h1) 6deg),
    conic-gradient(from calc(var(--mx) * 180deg) at var(--cx) var(--cy), var(--h1), var(--h2), var(--h3), var(--h4), var(--h5), var(--h6), var(--h7), var(--h1)),
    linear-gradient(160deg, var(--neutral-50), var(--neutral-0) 40%, var(--neutral-100));
  background-blend-mode: normal, soft-light, normal, normal;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--neutral-950) 12%, transparent), inset 0 1px 0 var(--neutral-0), 0 1px 1px color-mix(in srgb, var(--neutral-950) 6%, transparent), 0 18px 32px -22px color-mix(in srgb, var(--neutral-950) 25%, transparent);
  transform: perspective(1100px) rotateX(calc(var(--ty) * -8deg)) rotateY(calc(var(--tx) * 12deg));
  transition: --mx 700ms var(--ease-out), --my 700ms var(--ease-out), --tx 600ms var(--ease-out), --ty 600ms var(--ease-out); }
/* Silver: the foil reads as metal, not as a gradient, because of these broad light/dark bands */
.card::before { content: ''; position: absolute; inset: 0 -60%; z-index: -1; mix-blend-mode: multiply; translate: calc(var(--mx) * -30%) 0;
  background: linear-gradient(105deg, var(--neutral-0) 10%, var(--neutral-200) 22%, var(--neutral-0) 34%, var(--neutral-100) 50%, var(--neutral-0) 62%, var(--neutral-200) 76%, var(--neutral-0) 90%); }
/* Fine diffraction grating across the sheet */
.card::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--neutral-0) 30%, transparent) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.top { display: flex; justify-content: space-between; align-items: center; }
.top .lbl-1 { padding: 4px 8px; border-radius: var(--radius-2); background: var(--neutral-950); color: var(--neutral-0); }
.event { font: 500 20px/1.2 var(--font-sans); letter-spacing: -.04em; }
.who { font: 500 40px/1.05 var(--font-sans); letter-spacing: -.05em; margin-top: 8px; }
.role { color: var(--neutral-950); }
/* Rows sit on a matte white panel printed over the foil */
.panel { display: grid; gap: 16px; padding: 4px 16px 16px; border-radius: var(--radius-4); background: color-mix(in srgb, var(--neutral-0) 82%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--neutral-0) 90%, transparent); }
dl { display: grid; }
dl > div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 0; }
dl > div + div { border-top: 1px solid var(--line); }
dt { font-size: 14px; letter-spacing: -.03em; } dd { color: var(--text-body); }
.foot { font: 500 12px/1.4 var(--font-sans); letter-spacing: -.03em; color: var(--text-body); padding-top: 12px; border-top: 1px solid var(--line); }
.foot b { font-weight: 500; color: var(--text); }

@media (prefers-reduced-motion: reduce) { .card { transform: none; transition: none; } }
</style>
</head>
<body>
<div class="hit">
  <div class="card" aria-hidden="true">
    <div class="top"><span class="event">Full Circle</span><span class="lbl-1">4 Nov 2026</span></div>
    <div>
      <p class="lbl-1 role">Contributor · The B2B AI Standard</p>
      <p class="who">[Your name]</p>
    </div>
    <div class="panel">
      <dl>
        <div><dt>Named on stage</dt><dd class="lbl">Main room</dd></div>
        <div><dt>500-600 marketers</dt><dd class="lbl">Audience</dd></div>
        <div><dt>Launch posts and ads</dt><dd class="lbl">Paid by us</dd></div>
      </dl>
      <p class="foot">Stage access through <b>DemandSense, main sponsor</b>. No fee for contributors.</p>
    </div>
  </div>
</div>
<script>
// Foil and tilt follow the pointer; the untransformed wrapper is the hit area so the tilt doesn't feed back
const hit = document.querySelector('.hit'), card = hit.querySelector('.card');
const fine = matchMedia('(hover: hover) and (pointer: fine)'), still = matchMedia('(prefers-reduced-motion: reduce)');
if (fine.matches) {
  hit.addEventListener('pointermove', (e) => {
    if (still.matches) return;
    const r = hit.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.cssText = `--mx:${x.toFixed(3)};--my:${y.toFixed(3)};--tx:${(x - .5).toFixed(3)};--ty:${(y - .5).toFixed(3)}`;
  });
  hit.addEventListener('pointerleave', () => { card.style.cssText = ''; });
}
</script>
</body>
</html>
